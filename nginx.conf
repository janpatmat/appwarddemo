server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Flutter web output files aren't content-hashed, so make browsers revalidate
    # (cheap 304s via ETag) instead of serving a stale app after a redeploy.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
